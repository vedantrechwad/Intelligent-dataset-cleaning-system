<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Gauge Test</title>
    <script src="https://cdn.plot.ly/plotly-2.35.2.min.js"></script>
    <style>
        body { background-color: #0e1117; color: white; font-family: sans-serif; display: flex; gap: 20px; }
        .box { width: 450px; background-color: #1a1c23; padding: 15px; border-radius: 8px; }
    </style>
</head>
<body>
    <div class="box">
        <h3>Current (app.py)</h3>
        <div id="gauge_current"></div>
    </div>
    <div class="box">
        <h3>Fix Option A (Layout Title & Proper Gauge Center)</h3>
        <div id="gauge_fix_a"></div>
    </div>
    <div class="box">
        <h3>Fix Option B (Annotated Center Number)</h3>
        <div id="gauge_fix_b"></div>
    </div>

    <script>
        const score_val = 76.5;
        const grade = "C";

        // Current in app.py
        Plotly.newPlot('gauge_current', [{
            type: "indicator",
            mode: "gauge+number",
            value: score_val,
            align: "center",
            domain: { x: [0, 1], y: [0, 1] },
            number: { font: { size: 40 } },
            title: { text: "Data Quality Score (Grade " + grade + ")", font: { size: 18 } },
            gauge: {
                axis: { range: [0, 100] },
                bar: { color: "#4f46e5" },
                steps: [
                    { range: [0, 60], color: "rgba(239, 68, 68, 0.2)" },
                    { range: [60, 80], color: "rgba(245, 158, 11, 0.2)" },
                    { range: [80, 100], color: "rgba(16, 185, 129, 0.2)" }
                ]
            }
        }], {
            height: 240,
            margin: { l: 20, r: 20, t: 50, b: 20 },
            paper_bgcolor: "rgba(0,0,0,0)",
            plot_bgcolor: "rgba(0,0,0,0)",
            font: { color: "#ffffff" }
        }, { responsive: true });

        // Fix Option A
        Plotly.newPlot('gauge_fix_a', [{
            type: "indicator",
            mode: "gauge+number",
            value: score_val,
            domain: { x: [0, 1], y: [0, 1] },
            number: { font: { size: 38, color: "#ffffff" } },
            gauge: {
                axis: { range: [0, 100], tickcolor: "#94a3b8" },
                bar: { color: "#4f46e5" },
                steps: [
                    { range: [0, 60], color: "rgba(239, 68, 68, 0.25)" },
                    { range: [60, 80], color: "rgba(245, 158, 11, 0.25)" },
                    { range: [80, 100], color: "rgba(16, 185, 129, 0.25)" }
                ]
            }
        }], {
            title: { text: "Data Quality Score (Grade " + grade + ")", font: { size: 18, color: "#ffffff" }, x: 0.5, xanchor: "center" },
            height: 240,
            margin: { l: 25, r: 25, t: 45, b: 25 },
            paper_bgcolor: "rgba(0,0,0,0)",
            plot_bgcolor: "rgba(0,0,0,0)"
        }, { responsive: true });

        // Fix Option B: Gauge + Annotation
        Plotly.newPlot('gauge_fix_b', [{
            type: "indicator",
            mode: "gauge",
            value: score_val,
            domain: { x: [0, 1], y: [0, 1] },
            gauge: {
                axis: { range: [0, 100], tickcolor: "#94a3b8" },
                bar: { color: "#4f46e5" },
                steps: [
                    { range: [0, 60], color: "rgba(239, 68, 68, 0.25)" },
                    { range: [60, 80], color: "rgba(245, 158, 11, 0.25)" },
                    { range: [80, 100], color: "rgba(16, 185, 129, 0.25)" }
                ]
            }
        }], {
            title: { text: "Data Quality Score (Grade " + grade + ")", font: { size: 18, color: "#ffffff" }, x: 0.5, xanchor: "center" },
            annotations: [{
                text: "<b>" + score_val.toFixed(1) + "</b>",
                x: 0.5,
                y: 0.25,
                xref: "paper",
                yref: "paper",
                showarrow: false,
                font: { size: 40, color: "#ffffff" }
            }],
            height: 240,
            margin: { l: 25, r: 25, t: 45, b: 25 },
            paper_bgcolor: "rgba(0,0,0,0)",
            plot_bgcolor: "rgba(0,0,0,0)"
        }, { responsive: true });
    </script>
</body>
</html>
